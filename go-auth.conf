# Mosquitto Go Auth Plugin Configuration
# This enables JWT-only authentication via HTTP backend

# Load the plugin
auth_plugin /usr/lib/x86_64-linux-gnu/go-auth.so

# Log level (debug, info, warn, error)
auth_opt_log_level info

# Backends to use (http for API validation)
auth_opt_backends http

# Cache settings (optional, improves performance)
auth_opt_cache true
auth_opt_cache_type redis
auth_opt_cache_reset true
auth_opt_cache_refresh true
auth_opt_auth_cache_seconds 30
auth_opt_acl_cache_seconds 30

# Redis cache configuration (optional)
# auth_opt_cache_host localhost
# auth_opt_cache_port 6379

# HTTP Backend Configuration
# These endpoints will be called by the plugin to validate connections

# User authentication endpoint
auth_opt_http_host 127.0.0.1
auth_opt_http_port 2000
auth_opt_http_getuser_uri /api/mqtt/validate-connection/

# ACL check endpoint  
auth_opt_http_aclcheck_uri /api/mqtt/validate-acl/

# Superuser check endpoint (optional)
# Disabled: this reused the getuser endpoint, so every non-superuser
# connect/publish generated a guaranteed 403 (counted by fail2ban), causing
# false-positive IP bans under load. Admin bypass + per-topic ACL are already
# fully handled by mqtt_validate_connection / mqtt_validate_acl, so this
# separate superuser probe added no real security value.
# auth_opt_http_superuser_uri /api/mqtt/validate-connection/

# HTTP request settings
auth_opt_http_with_tls false
auth_opt_http_verify_peer false
auth_opt_http_timeout 5

# How the plugin sends credentials to your HTTP endpoints
# Options: form, json, params
# form = POST with form data (username=X&password=Y)
# json = POST with JSON body {"username":"X","password":"Y"}
# params = GET with query params (?username=X&password=Y)
auth_opt_http_method POST
auth_opt_http_params_mode json

# Response mode
# Options: status, json, text
# status = Check HTTP response code (200 = success, anything else = fail)
# json = Check JSON response {"ok": true/false}
# text = Check text response ("ok" = success)
auth_opt_http_response_mode status

# Disable dynamic security plugin when using go-auth
# (Uncomment this or disable dynsec.conf)
# plugin_opt_enable_dynamic_security false
