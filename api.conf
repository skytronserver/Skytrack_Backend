# VAPT: Allowlist of permitted CORS origins
map $http_origin $cors_allowed_origin {
    default                          "";
    "https://skytron.in"             "https://skytron.in";
    "https://www.skytron.in"         "https://www.skytron.in";
    "https://dev.skytron.in"         "https://dev.skytron.in";
    "https://skytrack.tech"          "https://skytrack.tech";
    "https://www.skytrack.tech"      "https://www.skytrack.tech";
    "https://dev.skytrack.tech"      "https://dev.skytrack.tech";
    "https://gromed.in"              "https://gromed.in";
    "https://api.gromed.in"          "https://api.gromed.in";
    "http://localhost:3000"          "http://localhost:3000";
}

server {

    listen 443 ssl;
    server_name api.skytron.in;

    client_max_body_size 100M;

    ssl_certificate     /home/azureuser/Skytrack_Backend/Skytronsystem/cert.pem;
    ssl_certificate_key /home/azureuser/Skytrack_Backend/Skytronsystem/key.pem;

    # VAPT: Block all HTTP methods except GET and POST
    # OPTIONS is handled here at Nginx and never forwarded to the app
    if ($request_method !~ ^(GET|POST|OPTIONS)$) {
        return 405;
    }

    location / {

        # VAPT: Intercept OPTIONS preflight at Nginx edge — never reaches Django
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  $cors_allowed_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST'          always;
            add_header 'Access-Control-Allow-Headers' 'content-type, authorization, x-csrftoken' always;
            add_header 'Access-Control-Max-Age'       86400                always;
            # No 'Allow' header — avoids method enumeration (VAPT)
            return 204;
        }

        proxy_pass https://127.0.0.1:2000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}

# Optionally, force HTTP -> HTTPS redirect
 