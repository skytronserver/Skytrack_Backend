# Mosquitto Authentication Plugin Configuration
# This configuration adds JWT token support alongside username/password auth

# Enable per-listener authentication settings
per_listener_settings true

# Listener for secure MQTT with TLS
listener 8883
protocol mqtt
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
require_certificate false
allow_zero_length_clientid false
use_username_as_clientid true
persistent_client_expiration 1d

# Use both dynamic security and external auth
# Dynamic security for existing users
plugin /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

# Enable allow_anonymous for external auth handling
# We'll manage actual auth in our hook scripts
# Note: Set to false for production once external auth is working
allow_anonymous false

# Authentication will be handled by:
# 1. Dynamic security (for existing username/password users)
# 2. External pre-auth hook (for JWT tokens and new users)

# Note: For full external auth support, you would need mosquitto-go-auth
# or mosquitto-auth-plug plugin, which are not installed by default
# Alternative: Use the pre-connection authentication approach with our scripts
