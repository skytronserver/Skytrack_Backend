#fileserver for fota
server {
    listen 443  default_server;
    server_name 103.195.217.127 _;

    

    #ssl_certificate /etc/nginx/ssl/skytron.crt;
    #ssl_certificate_key /etc/nginx/ssl/skytron.key;
    #ssl_trusted_certificate /etc/nginx/ssl/CABundle.crt;

    #ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_prefer_server_ciphers on;
    more_set_headers "Server: ";

    location /SKTN/ {
        alias /var/www/html/SKTN/;
        types { application/x-ns-proxy-autoconfig pac; }
        default_type application/octet-stream;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}


# API subdomain
server {
    listen 443;
    server_name map-geocoding.skytron.in;
    client_max_body_size 30M;
    #more_clear_headers 'Server';

    #ssl_certificate /etc/nginx/ssl/skytron.crt;
    #ssl_certificate_key /etc/nginx/ssl/skytron.key;
    #ssl_trusted_certificate /etc/nginx/ssl/CABundle.crt;
    more_set_headers "Server: ";

    location / {
        limit_except OPTIONS GET POST {
                deny all;
        }
        autoindex off;
        proxy_pass http://10.192.136.166:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

  
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme; 

   }


    # ✅ Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    #add_header X-XSS-Protection "1; mode=block" always;
    #add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

}



# API subdomain
server {
    listen 443;
    server_name map2.skytron.in;
    client_max_body_size 30M;
    #more_clear_headers 'Server';
    more_set_headers "Server: ";

    #ssl_certificate /etc/nginx/ssl/skytron.crt;
    #ssl_certificate_key /etc/nginx/ssl/skytron.key;
    #ssl_trusted_certificate /etc/nginx/ssl/CABundle.crt;


    # proxy settings
    location / {
        # CORS: allow local HTML and other origins to call map APIs/tiles.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Origin, Accept" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Origin, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        add_header Vary "Origin" always;

        proxy_pass http://10.192.136.166:8082; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

}

