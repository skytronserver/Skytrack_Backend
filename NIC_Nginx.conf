# API subdomain
server {
    listen 443;
    server_name api.skytron.in;
    client_max_body_size 30M;
    #more_clear_headers 'Server';
    more_set_headers "Server: ";

    ssl_certificate /etc/nginx/ssl/skytron.crt;
    ssl_certificate_key /etc/nginx/ssl/skytron.key;
    ssl_trusted_certificate /etc/nginx/ssl/CABundle.crt;

    # proxy settings
    #location /school/ {
    #    proxy_pass http://10.192.136.175:9478/;
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-For $remote_addr;
    #    proxy_set_header X-Forwarded-Proto $scheme;
    #}
    location ~ ^/api/(dev|docs|schema|redoc)/ {
        deny all;
    }

    location /admin/ {
       #allow <your-office-IP>;   # or remove this line to block everyone
       deny all;
   }


    location /files/ {
        proxy_pass http://10.192.136.165:9000/skytrack-files/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        limit_except OPTIONS GET POST {
                deny all;
        }
        autoindex off;
        proxy_pass http://api_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;


    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

   }


    # ✅ Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    #add_header X-XSS-Protection "1; mode=block" always;
    #add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

}
# Frontend subdomain
server {
    listen 443;
    server_name skytron.in;

    #ssl_certificate /etc/nginx/ssl/skytron.crt;
    #ssl_certificate_key /etc/nginx/ssl/skytron.key;
    #ssl_trusted_certificate /etc/nginx/ssl/CABundle.crt;

    more_set_headers "Server: ";
    
    #ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://frontend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Serve static template PDFs from the React (Nginx) container.
    # This avoids SPA fallback returning index.html for missing files.
    location ^~ /templates/ {
        proxy_pass http://frontend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location ^~ /docs/ {
        proxy_pass http://frontend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /files/ {
        alias /var/www/html/SKTN/; # /home/Admin/public_files/;
        #autoindex on;               # Optional: shows file listing
        add_header Cache-Control "public, max-age=3600";
    }

    # Static assets caching
    #location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg|eot)$ {
    #    expires 1y;
    #    add_header Cache-Control "public";
    #    try_files $uri =404;
    #}


    # Deny sensitive files
    location ~* \.(env|json|log|git|sql)$ {
        deny all;
    }

    # ✅ Security Headers
    #add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.skytron.in https://api.gromed.in https://skytron.in https://gromed.in https://map.gromed.in https://map3.gromed.in https://map2.gromed.in https://server.arcgisonline.com https://map-geocoding.skytron.in https://map.skytron.in https://map2.skytron.in https://skytrack.tech:2000/ https://bhuvan-vec1.nrsc.gov.in/bhuvan/gwc/service/wms https://*.openstreetmap.org/; media-src 'self' blob: https://api.skytron.in https://api.gromed.in https://map.gromed.in https://skytron.in https://map2.gromed.in https://map-geocoding.skytron.in https://map.skytron.in https://map2.skytron.in https://gromed.in; img-src 'self' data: blob: https://api.skytron.in https://api.gromed.in https://skytron.in https://gromed.in https://map-geocoding.skytron.in https://map.skytron.in https://map2.skytron.in https://map.gromed.in https://map2.gromed.in https://map3.gromed.in https://server.arcgisonline.com https://skytrack.tech:2000/ https://bhuvan-vec1.nrsc.gov.in/ https://fonts.gstatic.com/ https://*.openstreetmap.org/; script-src 'self'; object-src 'none'; frame-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


