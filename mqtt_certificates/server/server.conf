[req]
default_bits = 2048
prompt = no
default_md = sha256
distinguished_name = dn
req_extensions = v3_req

[dn]
C=IN
ST=Assam
L=Guwahati
O=SKYTRON
OU=MQTT Server
CN=mqtt.skytron.in

[v3_req]
basicConstraints = CA:FALSE
keyUsage = critical,digitalSignature,keyEncipherment
extendedKeyUsage = serverAuth
subjectAltName = @alt_names

[alt_names]
DNS.1 = localhost
DNS.2 = mqtt.skytron.in
DNS.3 = api.gromed.in
DNS.4 = *.skytron.in
IP.1 = 127.0.0.1
IP.2 = 10.192.136.179
IP.3 = 135.235.166.209
IP.4 = 103.195.217.127

